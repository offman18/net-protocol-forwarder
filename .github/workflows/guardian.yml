name: Heartbeat Guardian
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Pacemaker ping (fire-and-forget, server continues async)
        env:
          SCANNER_URL: ${{ secrets.SCANNER_URL }}
        run: |
          curl -sL --post302 -m 25 -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36" -c /tmp/cj -b /tmp/cj -X POST "$SCANNER_URL" -H "Content-Type: application/json" -d '{"action":"scan"}' -o /dev/null -w "ping %{http_code}\n" || true
          echo "pacemaker fired (000/timeout still means server-side run started)"
