name: Scan Driver
on:
  schedule:
    - cron: "*/8 * * * *"
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger scanner webapp
        env:
          SCANNER_URL: ${{ secrets.SCANNER_URL }}
        run: |
          curl -sL --post302 -m 60 -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36" -c /tmp/cj -b /tmp/cj -X POST "$SCANNER_URL" -H "Content-Type: application/json" -d '{"action":"scan"}' -o /dev/null -w "scan %{http_code}\n" || true
